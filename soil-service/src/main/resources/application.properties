
spring.application.name=soil-service

server.port=8080

# ===============================
# PostgreSQL
# ===============================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/landia}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:landia}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:landia}
spring.datasource.driver-class-name=org.postgresql.Driver
# ===============================
# JPA / Hibernate
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# MQTT
# ===============================

mqtt.broker.url=${MQTT_BROKER_URL:tcp://mqtt-broker:1883}

mqtt.client.id=landia-soil-service

mqtt.topic=landia/sensor/soil

mqtt.ack.topic=landia/ack/landia-esp32-01

# ===============================
# Actuator
# ===============================

management.endpoints.web.exposure.include=health,info
