####################################################
# LANDIA SMART FARMING
# Mosquitto MQTT Broker Configuration
####################################################


# ==================================================
# LISTENER
# ==================================================

# MQTT menggunakan port 1883
listener 1883

# Protocol MQTT
protocol mqtt

# Development / Local Testing
#
# Untuk tahap development, client boleh connect
# tanpa username dan password.
#
# CATATAN:
# Untuk production nanti WAJIB menggunakan
# authentication dan authorization.
allow_anonymous true


# ==================================================
# PERSISTENCE
# ==================================================

# Menyimpan data persistence MQTT ke disk
persistence true

# Lokasi persistence
persistence_location /mosquitto/data/

# Autosave persistence setiap 180 detik
autosave_interval 180


# ==================================================
# LOGGING
# ==================================================

# Kirim log ke stdout
# Cocok untuk Docker karena log dapat dilihat
# menggunakan:
#
# docker logs landia-mqtt
log_dest stdout

# Jenis log
log_type error
log_type warning
log_type notice
log_type information

# Menampilkan pesan ketika client connect/disconnect
connection_messages true

# Menampilkan timestamp pada log
log_timestamp true


# ==================================================
# MESSAGE LIMIT
# ==================================================

# Maksimal pesan yang dapat diantrikan
max_queued_messages 1000

# Maksimal ukuran satu MQTT message
# 1048576 bytes = 1 MB
message_size_limit 1048576


# ==================================================
# KEEP ALIVE
# ==================================================

# Maksimal nilai MQTT keep alive
max_keepalive 300


# ==================================================
# PERFORMANCE
# ==================================================

# Maksimal pesan yang sedang in-flight
max_inflight_messages 100

# Jangan melakukan upgrade QoS
upgrade_outgoing_qos false


# ==================================================
# RETAIN
# ==================================================

# MQTT broker mengizinkan retained message
retain_available true


# ==================================================
# SYSTEM TOPIC
# ==================================================

# Interval system topic $SYS
sys_interval 60


# ==================================================
# LANDIA SMART FARMING MQTT TOPICS
# ==================================================

# --------------------------------------------------
# SENSOR TOPICS
# --------------------------------------------------

# DHT11
# Temperature & Humidity
#
# landia/sensor/dht


# Soil Sensor
#
# landia/sensor/soil


# Water Level Sensor
#
# landia/sensor/water-level


# Rain Sensor
#
# landia/sensor/rain


# Water Flow Sensor
#
# landia/sensor/flow


# --------------------------------------------------
# IRRIGATION ACTUATOR
# --------------------------------------------------

# Command dari irrigation-service
# menuju ESP32 / irrigation controller
#
# landia/actuator/irrigation


# Event/status irrigation
#
# landia/irrigation/event


####################################################
# END OF LANDIA SMART FARMING MQTT CONFIGURATION
####################################################