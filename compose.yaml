services:

  # ==========================================
  # POSTGRESQL
  # ==========================================
  postgres:
    image: postgres:17
    container_name: landia-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Jakarta

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # ==========================================
  # MQTT BROKER
  # ==========================================
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: landia-mqtt
    restart: unless-stopped

    ports:
      - "1883:1883"

    volumes:
      - ./mqtt-broker/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log


  # ==========================================
  # DHT SERVICE
  # ==========================================
  dht-service:
    build:
      context: ./dht-service
      dockerfile: dockerfile

    container_name: landia-dht-service
    restart: unless-stopped

    environment:
      TZ: Asia/Jakarta
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Jakarta"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "8081:8081"

    depends_on:
      postgres:
        condition: service_healthy
      mqtt-broker:
        condition: service_started


  # ==========================================
  # SOIL SERVICE
  # ==========================================
  soil-service:
    build:
      context: ./soil-service
      dockerfile: dockerfile

    container_name: landia-soil-service
    restart: unless-stopped

    environment:
      TZ: Asia/Jakarta
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Jakarta"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      MQTT_BROKER_URL: tcp://mqtt-broker:1883

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy
      mqtt-broker:
        condition: service_started


  # ==========================================
  # WATER LEVEL SERVICE
  # ==========================================
  water-level-service:
    build:
      context: ./water-level-service
      dockerfile: dockerfile

    container_name: landia-water-level-service
    restart: unless-stopped

    environment:
      TZ: Asia/Jakarta
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Jakarta"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "8082:8082"

    depends_on:
      postgres:
        condition: service_healthy
      mqtt-broker:
        condition: service_started


  # ==========================================
  # RAIN SERVICE
  # ==========================================
  rain-service:
    build:
      context: ./rain-service
      dockerfile: dockerfile

    container_name: landia-rain-service
    restart: unless-stopped

    environment:
      TZ: Asia/Jakarta
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Jakarta"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "8083:8083"

    depends_on:
      postgres:
        condition: service_healthy
      mqtt-broker:
        condition: service_started


  # ==========================================
  # FLOW SERVICE
  # ==========================================
  flow-service:
    build:
      context: ./flow-service
      dockerfile: dockerfile

    container_name: landia-flow-service
    restart: unless-stopped

    environment:
      TZ: Asia/Jakarta
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Jakarta"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      MQTT_BROKER_URL: tcp://mqtt-broker:1883
    ports:
      - "8084:8084"

    depends_on:
      postgres:
        condition: service_healthy
      mqtt-broker:
        condition: service_started


   # ==========================================
  # IRRIGATION SERVICE
  # ==========================================
  irrigation-service:
    build:
      context: ./irrigation-service
      dockerfile: dockerfile

    container_name: landia-irrigation-service
    restart: unless-stopped

    environment:
      TZ: Asia/Jakarta
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Jakarta"

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      MQTT_BROKER_URL: tcp://mqtt-broker:1883
      MQTT_CLIENT_ID: landia-irrigation-service
      MQTT_IRRIGATION_EVENT_TOPIC: landia/irrigation/event
      MQTT_ACK_TOPIC: landia/ack/landia-esp32-01

    ports:
      - "8085:8085"

    depends_on:
      postgres:
        condition: service_healthy
      mqtt-broker:
        condition: service_started
        
  # ==========================================
  # API GATEWAY
  # ==========================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: dockerfile

    container_name: landia-api-gateway
    restart: unless-stopped

    environment:
      TZ: Asia/Jakarta
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Jakarta"

      SERVER_PORT: "8086"

      SOIL_SERVICE_URL: http://soil-service:8080
      DHT_SERVICE_URL: http://dht-service:8081
      WATER_LEVEL_SERVICE_URL: http://water-level-service:8082
      RAIN_SERVICE_URL: http://rain-service:8083
      FLOW_SERVICE_URL: http://flow-service:8084
      IRRIGATION_SERVICE_URL: http://irrigation-service:8085

    ports:
      - "8086:8086"

    depends_on:
      soil-service:
        condition: service_started
      dht-service:
        condition: service_started
      water-level-service:
        condition: service_started
      rain-service:
        condition: service_started
      flow-service:
        condition: service_started
      irrigation-service:
        condition: service_started



# ==========================================
# VOLUMES
# ==========================================
volumes:
  postgres-data:
  mosquitto-data:
  mosquitto-log: