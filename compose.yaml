services:

  # ==========================================
  # POSTGRESQL
  # ==========================================
  postgres:
    image: postgres:17
    container_name: landia-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: landia
      POSTGRES_USER: landia
      POSTGRES_PASSWORD: landia_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data


  # ==========================================
  # MQTT BROKER
  # ==========================================
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: landia-mqtt
    restart: unless-stopped

    ports:
      - "1883:1883"

    volumes:
      - ./mqtt-broker/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log


  # ==========================================
  # DHT SERVICE
  # ==========================================
  dht-service:
    build:
      context: ./dht-service
      dockerfile: Dockerfile

    container_name: landia-dht-service
    restart: unless-stopped

    ports:
      - "8081:8081"

    depends_on:
      - postgres
      - mqtt-broker


  # ==========================================
  # SOIL SERVICE
  # ==========================================
  soil-service:
    build:
      context: ./soil-service
      dockerfile: Dockerfile

    container_name: landia-soil-service
    restart: unless-stopped

    ports:
      - "8080:8080"

    depends_on:
      - postgres
      - mqtt-broker


  # ==========================================
  # WATER LEVEL SERVICE
  # ==========================================
  water-level-service:
    build:
      context: ./water-level-service
      dockerfile: Dockerfile

    container_name: landia-water-level-service
    restart: unless-stopped

    ports:
      - "8082:8082"

    depends_on:
      - postgres
      - mqtt-broker


  # ==========================================
  # RAIN SERVICE
  # ==========================================
  rain-service:
    build:
      context: ./rain-service
      dockerfile: Dockerfile

    container_name: landia-rain-service
    restart: unless-stopped

    ports:
      - "8083:8083"

    depends_on:
      - postgres
      - mqtt-broker


  # ==========================================
  # FLOW SERVICE
  # ==========================================
  flow-service:
    build:
      context: ./flow-service
      dockerfile: Dockerfile

    container_name: landia-flow-service
    restart: unless-stopped

    ports:
      - "8084:8084"

    depends_on:
      - postgres
      - mqtt-broker


  # ==========================================
  # IRRIGATION SERVICE
  # ==========================================
  irrigation-service:
    build:
      context: ./irrigation-service
      dockerfile: Dockerfile

    container_name: landia-irrigation-service
    restart: unless-stopped

    ports:
      - "8085:8085"

    depends_on:
      - postgres
      - mqtt-broker


# ==========================================
# VOLUMES
# ==========================================
volumes:

  postgres-data:

  mosquitto-data:

  mosquitto-log: