spring.application.name=dht-service

server.port=8081


# ===============================
# PostgreSQL
# ===============================

spring.datasource.url=jdbc:postgresql://postgres:5432/landia
spring.datasource.username=landia
spring.datasource.password=landia_dev_password
spring.datasource.driver-class-name=org.postgresql.Driver


# ===============================
# JPA / Hibernate
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# ===============================
# MQTT
# ===============================

mqtt.broker.url=tcp://mqtt-broker:1883

mqtt.client.id=landia-dht-service

mqtt.topic=landia/sensor/dht


# ===============================
# Actuator
# ===============================

management.endpoints.web.exposure.include=health,info