
spring.application.name=flow-service

server.port=8084

# ===============================
# PostgreSQL
# ===============================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/landia}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:landia}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# MQTT
# ===============================

mqtt.broker.url=${MQTT_BROKER_URL:tcp://mqtt-broker:1883}

mqtt.client.id=${MQTT_CLIENT_ID:landia-flow-service}

mqtt.topic=${MQTT_FLOW_TOPIC:landia/sensor/flow}

mqtt.ack.topic=${MQTT_ACK_TOPIC:landia/ack/landia-esp32-01}

# ===============================
# Actuator
# ===============================

management.endpoints.web.exposure.include=health,info
